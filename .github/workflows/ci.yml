name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Format, lint, build, and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ clang-tidy clang-format

      - name: Configure
        run: cmake --preset gcc-ninja

      - name: Check formatting
        run: cmake --build --preset gcc-ninja --target spsc_format_check

      - name: Run clang-tidy
        run: cmake --build --preset gcc-ninja --target spsc_tidy_check

      - name: Build
        run: cmake --build --preset gcc-ninja

      - name: Run tests
        run: ctest --preset gcc-ninja
